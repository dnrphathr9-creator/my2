services:
  db:
    image: mysql:8.4
    container_name: repair-db
    environment:
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql
      - dbdata:/var/lib/mysql

  pma:
    image: phpmyadmin
    container_name: pma
    environment:
      PMA_HOST: db
    ports:
      - "8080:80"
    depends_on:
      - db

volumes:
  dbdata:
