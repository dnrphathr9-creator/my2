stages:
  - build
  - test
  - push
  - deploy

variables:
  REGISTRY: localhost:5000

# 1) build: สร้าง image ของ backend และ frontend
build:
  stage: build
  script:
    - docker build -t $REGISTRY/repair-backend:latest ./backend
    - docker build -t $REGISTRY/repair-frontend:latest ./frontend

# 2) test: Unit Test (ฟังก์ชันตรวจข้อมูล) และ Integration Test (API ตอบได้จริง)
test:
  stage: test
  script:
    - docker run --rm $REGISTRY/repair-backend:latest npm test
    - docker rm -f test-api || true
    - docker run -d --name test-api -e PORT=3000 -e JWT_SECRET=test $REGISTRY/repair-backend:latest
    - sleep 3
    - docker exec test-api node -e "fetch('http://localhost:3000/api/categories').then(r => { console.log('status', r.status); process.exit(r.status === 401 ? 0 : 1) })"
  after_script:
    - docker rm -f test-api || true

# 3) push: ส่ง image ขึ้น Registry ของทีม
push:
  stage: push
  script:
    - docker push $REGISTRY/repair-backend:latest
    - docker push $REGISTRY/repair-frontend:latest

# 4) deploy: ดึง image ล่าสุดแล้วเปิดระบบบน Production
deploy:
  stage: deploy
  script:
    - docker compose -f docker-compose.prod.yaml pull backend frontend
    - docker compose -f docker-compose.prod.yaml up -d
  only:
    - main
